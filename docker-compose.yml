services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/compose/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5

  identity-migrate:
    image: migrate/migrate:v4.15.2
    volumes:
      - ./cmd/identity-service/db/migrations:/migrations
    command: -path=/migrations -database=postgres://postgres:postgres@postgres:5432/identity_db?sslmode=disable up
    depends_on:
      postgres:
        condition: service_healthy

  transactions-migrate:
    image: migrate/migrate:v4.15.2
    volumes:
      - ./cmd/transaction-manager/db/migrations:/migrations
    command: -path=/migrations -database=postgres://postgres:postgres@postgres:5432/transactions_db?sslmode=disable up
    depends_on:
      postgres:
        condition: service_healthy

  financing-migrate:
    image: migrate/migrate:v4.15.2
    volumes:
      - ./cmd/financing-engine/db/migrations:/migrations
    command: -path=/migrations -database=postgres://postgres:postgres@postgres:5432/financing_db?sslmode=disable up
    depends_on:
      postgres:
        condition: service_healthy

  feedback-migrate:
    image: migrate/migrate:v4.15.2
    volumes:
      - ./cmd/feedback-service/db/migrations:/migrations
    command: -path=/migrations -database=postgres://postgres:postgres@postgres:5432/feedback_db?sslmode=disable up
    depends_on:
      postgres:
        condition: service_healthy


  transaction-manager:
    build:
      context: .
      target: transaction-manager
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/transactions_db?sslmode=disable
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      transactions-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  identity-service:
    build:
      context: .
      target: identity-service
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/identity_db?sslmode=disable
    depends_on:
      identity-migrate:
        condition: service_completed_successfully

  financing-engine:
    build:
      context: .
      target: financing-engine
    ports:
      - "8082:8082"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/financing_db?sslmode=disable
    depends_on:
      financing-migrate:
        condition: service_completed_successfully

  tokenization-migrate:
    image: migrate/migrate:v4.15.2
    volumes:
      - ./cmd/tokenization-engine/db/migrations:/migrations
    command: -path=/migrations -database=postgres://postgres:postgres@postgres:5432/tokenization_db?sslmode=disable up
    depends_on:
      postgres:
        condition: service_healthy

  ledger-migrate:
    image: migrate/migrate:v4.15.2
    volumes:
      - ./cmd/ledger-service/db/migrations:/migrations
    command: -path=/migrations -database=postgres://postgres:postgres@postgres:5432/ledger_db?sslmode=disable up
    depends_on:
      postgres:
        condition: service_healthy

  properties-migrate:
    image: migrate/migrate:v4.15.2
    volumes:
      - ./cmd/property-registry-service/db/migrations:/migrations
    command: -path=/migrations -database=postgres://postgres:postgres@postgres:5432/properties_db?sslmode=disable up
    depends_on:
      postgres:
        condition: service_healthy

  tokenization-engine:
    build:
      context: .
      target: tokenization-engine
    ports:
      - "8083:8083"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/tokenization_db?sslmode=disable
    depends_on:
      tokenization-migrate:
        condition: service_completed_successfully

  ledger-service:
    build:
      context: .
      target: ledger-service
    ports:
      - "8084:8084"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/ledger_db?sslmode=disable
    depends_on:
      ledger-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  property-registry-service:
    build:
      context: .
      target: property-registry-service
    ports:
      - "8085:8085"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/properties_db?sslmode=disable
    depends_on:
      properties-migrate:
        condition: service_completed_successfully

  feedback-service:
    build:
      context: .
      target: feedback-service
    ports:
      - "8086:8086"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/feedback_db?sslmode=disable
    depends_on:
      feedback-migrate:
        condition: service_completed_successfully


  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - transaction-manager
      - identity-service
      - financing-engine
      - tokenization-engine
      - ledger-service
      - feedback-service
      - property-registry-service

volumes:
  pgdata:
