replicaCount: 2

image:
  repository: ghcr.io/realestate-trust/monorepo/microservice
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 250m
    memory: 128Mi

healthCheck:
  path: /api/v1/health
  initialDelaySeconds: 5
  periodSeconds: 10

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

ingress:
  enabled: false
  className: "nginx"
  host: api.trust.realestate.com
  path: /
  whitelistSourceRange: ""

db:
  migrations:
    enabled: false
    databaseUrlEnv: "DATABASE_URL"
    scripts: {}

smokeTest:
  enabled: false
  path: /api/v1/health
