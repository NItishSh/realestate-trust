replicaCount: 1

image:
  repository: ghcr.io/realestate-trust/monorepo/microservice
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

healthCheck:
  livenessPath: /api/v1/health/live
  readinessPath: /api/v1/health/ready
  path: /api/v1/health
  initialDelaySeconds: 5
  periodSeconds: 10

vpa:
  enabled: true
  updateMode: "Off"

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

keda:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  triggerAuth:
    enabled: false
    secretTargetRef: []
  triggers: []

ingress:
  enabled: false
  className: "nginx"
  host: api.trust.realestate.com
  path: /
  whitelistSourceRange: ""

db:
  migrations:
    enabled: false
    databaseUrlEnv: "DATABASE_URL"
    scripts: {}

smokeTest:
  enabled: false
  script: |
    echo "Verifying health of {{ .Release.Name }} on port {{ .Values.service.port }}..."
    attempt=1
    while [ $attempt -le 12 ]; do
      if curl -sf http://{{ .Release.Name }}:{{ .Values.service.port }}/api/v1/health; then
        echo "Success!"
        exit 0
      fi
      echo "Not ready yet, retrying in 5s (attempt $attempt/12)..."
      sleep 5
      attempt=$((attempt + 1))
    done
    echo "Failed to connect after 60s"
    exit 1
