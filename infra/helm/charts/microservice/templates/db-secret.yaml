{{- if and .Values.db.migrations.enabled .Values.db.migrations.databaseUrl }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-secret
  labels:
    app: {{ .Release.Name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    argocd.argoproj.io/hook: PreSync
type: Opaque
stringData:
  {{ .Values.db.migrations.databaseUrlEnv | default "DATABASE_URL" }}: {{ .Values.db.migrations.databaseUrl | quote }}
{{- end }}
