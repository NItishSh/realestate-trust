image:
  repository: ghcr.io/realestate-trust/monorepo/tokenization-engine
service:
  type: NodePort
  port: 8083
  targetPort: 8083
  nodePort: 30083
resources:
  limits:
    cpu: 800m
    memory: 384Mi
  requests:
    cpu: 400m
    memory: 192Mi
smokeTest:
  enabled: true
  script: |
    echo "Sleeping for pod startup..."
    # 1. Wait for identity-service to get JWT token
    attempt=1
    while [ $attempt -le 12 ]; do
      if curl -sf http://identity-service:8081/api/v1/health; then
        break
      fi
      echo "identity-service not ready, retrying in 5s (attempt $attempt/12)..."
      sleep 5
      attempt=$((attempt + 1))
    done

    PASS_KEY="password"
    PASS_VAL="password123"
    TOKEN=$(curl -s -X POST -H "Content-Type: application/json" -d "{\"email\":\"aryan.dev@realestate.in\",\"${PASS_KEY}\":\"${PASS_VAL}\"}" http://identity-service:8081/api/v1/login | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')

    # 2. Verify tokenization-engine pools API endpoint
    attempt=1
    while [ $attempt -le 12 ]; do
      if curl -sf -X POST -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" -d '{"propertyId":"prop-123","totalTokens":1000,"tokenPrice":500.0}' http://tokenization-engine:8083/api/v1/pools; then
        echo "Success!"
        exit 0
      fi
      echo "tokenization-engine not ready, retrying in 5s (attempt $attempt/12)..."
      sleep 5
      attempt=$((attempt + 1))
    done
    echo "Failed to connect after 60s"
    exit 1
