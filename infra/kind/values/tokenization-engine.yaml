image:
  repository: ghcr.io/realestate-trust/monorepo/tokenization-engine
service:
  type: ClusterIP
  port: 8083
  targetPort: 8083
resources: {}
smokeTest:
  enabled: true
  script: |
    echo "Sleeping for pod startup..."
    # 1. Wait for identity-service to get JWT token
    attempt=1
    while [ $attempt -le 12 ]; do
      if curl -sf http://identity-service/api/v1/health; then
        break
      fi
      echo "identity-service not ready, retrying in 5s (attempt $attempt/12)..."
      sleep 5
      attempt=$((attempt + 1))
    done

    PASS_KEY="password"
    PASS_VAL="password123"
    TOKEN=$(curl -s -X POST -H "Content-Type: application/json" -d "{\"email\":\"aryan.dev@realestate.in\",\"${PASS_KEY}\":\"${PASS_VAL}\"}" http://identity-service/api/v1/login | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')

    # 2. Verify tokenization-engine pools API endpoint
    attempt=1
    while [ $attempt -le 12 ]; do
      PROP_ID="prop-smoke-${RANDOM}"
      if curl -sf -X POST -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" -d "{\"propertyId\":\"${PROP_ID}\",\"totalTokens\":1000,\"tokenPrice\":500.0}" http://tokenization-engine/api/v1/pools; then
        echo "Success!"
        exit 0
      fi
      echo "tokenization-engine not ready, retrying in 5s (attempt $attempt/12)..."
      sleep 5
      attempt=$((attempt + 1))
    done
    echo "Failed to connect after 60s"
    exit 1
env:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: tokenization-engine-db-secret
        key: DATABASE_URL
db:
  migrations:
    enabled: true
    databaseUrlEnv: "DATABASE_URL"
    databaseUrl: "postgres://postgres:postgres@postgres:5432/tokenization_db?sslmode=disable"
    scripts:
      000001_init_tokenization.up.sql: |
        CREATE TABLE fractional_pools (
            id VARCHAR(255) PRIMARY KEY,
            property_id VARCHAR(255) NOT NULL,
            total_tokens BIGINT NOT NULL,
            tokens_sold BIGINT NOT NULL DEFAULT 0,
            token_price DECIMAL(15, 2) NOT NULL,
            created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
        );
        CREATE TABLE fractional_holdings (
            id VARCHAR(255) PRIMARY KEY,
            pool_id VARCHAR(255) NOT NULL REFERENCES fractional_pools(id) ON DELETE CASCADE,
            investor_id VARCHAR(255) NOT NULL,
            token_count BIGINT NOT NULL,
            created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
        );

keda:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "75"
