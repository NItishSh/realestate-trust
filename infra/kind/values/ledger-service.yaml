image:
  repository: ghcr.io/realestate-trust/monorepo/ledger-service
service:
  type: NodePort
  port: 8084
  targetPort: 8084
  nodePort: 30084
smokeTest:
  enabled: true
  script: |
    echo "Sleeping for pod startup..."
    sleep 5
    echo "Getting JWT token..."
    TOKEN=$(curl -s -X POST -H "Content-Type: application/json" -d '{"email":"aryan.dev@realestate.in","password":"password123"}' http://identity-service:8081/api/v1/login | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
    echo "Verifying ledger-service transaction block write API endpoint..."
    curl -f -X POST -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" -d '{"payload":"smoke audit log"}' http://ledger-service:8084/api/v1/logs
