image:
  repository: ghcr.io/realestate-trust/monorepo/ledger-service
service:
  type: NodePort
  port: 8084
  targetPort: 8084
  nodePort: 30084
smokeTest:
  enabled: true
  script: |
    echo "Sleeping for pod startup..."
    sleep 5
    echo "Verifying ledger-service transaction block write API endpoint..."
    curl -f -X POST -H "Content-Type: application/json" -d '{"payload":"smoke audit log"}' http://ledger-service:8084/api/v1/logs
