image:
  repository: ghcr.io/realestate-trust/monorepo/financing-engine
service:
  type: NodePort
  port: 8082
  targetPort: 8082
  nodePort: 30082
smokeTest:
  enabled: true
  script: |
    echo "Sleeping for pod startup..."
    # 1. Wait for identity-service to get JWT token
    attempt=1
    while [ $attempt -le 12 ]; do
      if curl -sf http://identity-service:8081/api/v1/health; then
        break
      fi
      echo "identity-service not ready, retrying in 5s (attempt $attempt/12)..."
      sleep 5
      attempt=$((attempt + 1))
    done

    PASS_KEY="password"
    PASS_VAL="password123"
    TOKEN=$(curl -s -X POST -H "Content-Type: application/json" -d "{\"email\":\"aryan.dev@realestate.in\",\"${PASS_KEY}\":\"${PASS_VAL}\"}" http://identity-service:8081/api/v1/login | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')

    # 2. Verify financing-engine loans API endpoint
    attempt=1
    while [ $attempt -le 12 ]; do
      if curl -sf -X POST -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" -d '{"transactionId":"tx-123","userId":"usr-123","requestedAmount":400000.00,"propertyValue":1000000.00}' http://financing-engine:8082/api/v1/loans; then
        echo "Success!"
        exit 0
      fi
      echo "financing-engine not ready, retrying in 5s (attempt $attempt/12)..."
      sleep 5
      attempt=$((attempt + 1))
    done
    echo "Failed to connect after 60s"
    exit 1

env:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: financing-engine-db-secret
        key: DATABASE_URL
db:
  migrations:
    enabled: true
    databaseUrlEnv: "DATABASE_URL"
    databaseUrl: "postgres://postgres:postgres@postgres:5432/financing_db?sslmode=disable"
    scripts:
      000001_init_financing.up.sql: |
        CREATE TYPE loan_status AS ENUM ('APPLIED', 'UNDERWRITING', 'APPROVED', 'REJECTED', 'DISBURSED');
        CREATE TYPE disbursement_status AS ENUM ('PENDING', 'COMPLETED', 'FAILED');
        CREATE TABLE loans (
            id VARCHAR(255) PRIMARY KEY,
            transaction_id VARCHAR(255) NOT NULL,
            user_id VARCHAR(255) NOT NULL,
            lender_id VARCHAR(255),
            requested_amount DECIMAL(15, 2) NOT NULL,
            approved_amount DECIMAL(15, 2),
            status loan_status NOT NULL DEFAULT 'APPLIED',
            created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
            updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
        );
        CREATE TABLE disbursements (
            id VARCHAR(255) PRIMARY KEY,
            loan_id VARCHAR(255) NOT NULL REFERENCES loans(id) ON DELETE CASCADE,
            virtual_account_number VARCHAR(50) NOT NULL,
            disbursed_amount DECIMAL(15, 2) NOT NULL,
            transaction_reference VARCHAR(100) UNIQUE NOT NULL,
            status disbursement_status NOT NULL DEFAULT 'PENDING',
            disbursed_at TIMESTAMP WITH TIME ZONE,
            created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
            updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
        );
        CREATE INDEX idx_loans_transaction ON loans(transaction_id);
        CREATE INDEX idx_disbursements_loan ON disbursements(loan_id);
