image:
  repository: ghcr.io/realestate-trust/monorepo/transaction-manager
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
resources: {}
ingress:
  enabled: true
  whitelistSourceRange: "125.16.0.0/16,202.54.30.0/24"
  path: /api/v1/transactions
smokeTest:
  enabled: true
  script: |
    echo "Sleeping for pod startup..."
    # 1. Wait for identity-service to get JWT token
    attempt=1
    while [ $attempt -le 12 ]; do
      if curl -sf http://identity-service:8081/api/v1/health; then
        break
      fi
      echo "identity-service not ready, retrying in 5s (attempt $attempt/12)..."
      sleep 5
      attempt=$((attempt + 1))
    done

    PASS_KEY="password"
    PASS_VAL="password123"
    TOKEN=$(curl -s -X POST -H "Content-Type: application/json" -d "{\"email\":\"aryan.dev@realestate.in\",\"${PASS_KEY}\":\"${PASS_VAL}\"}" http://identity-service:8081/api/v1/login | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')

    # 2. Verify transaction-manager transactions API endpoint
    attempt=1
    while [ $attempt -le 12 ]; do
      PROP_ID="prop-smoke-${RANDOM}"
      if curl -sf -X POST -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" -d "{\"propertyId\":\"${PROP_ID}\",\"buyerId\":\"usr-123\",\"sellerId\":\"usr-456\",\"totalAmount\":500000.00}" http://transaction-manager:8080/api/v1/transactions; then
        echo "Success!"
        exit 0
      fi
      echo "transaction-manager not ready, retrying in 5s (attempt $attempt/12)..."
      sleep 5
      attempt=$((attempt + 1))
    done
    echo "Failed to connect after 60s"
    exit 1

env:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: transaction-manager-db-secret
        key: DATABASE_URL
  - name: RABBITMQ_URL
    value: "amqp://guest:guest@rabbitmq:5672/"
db:
  migrations:
    enabled: true
    databaseUrlEnv: "DATABASE_URL"
    databaseUrl: "postgres://postgres:postgres@postgres:5432/transactions_db?sslmode=disable"
    scripts:
      000001_init_escrow.up.sql: |
        CREATE TYPE transaction_status AS ENUM ('DRAFT', 'ESCROW', 'FUNDED', 'CLOSED', 'CANCELLED');
        CREATE TABLE transactions (
            id VARCHAR(255) PRIMARY KEY,
            property_id VARCHAR(255) NOT NULL,
            buyer_id VARCHAR(255) NOT NULL,
            seller_id VARCHAR(255) NOT NULL,
            total_amount DECIMAL(15, 2) NOT NULL,
            status transaction_status NOT NULL DEFAULT 'DRAFT',
            created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
            updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
        );
        CREATE TABLE escrow_accounts (
            id VARCHAR(255) PRIMARY KEY,
            transaction_id VARCHAR(255) NOT NULL REFERENCES transactions(id) ON DELETE CASCADE,
            virtual_account_number VARCHAR(50) UNIQUE NOT NULL,
            bank_partner VARCHAR(100) NOT NULL,
            balance DECIMAL(15, 2) NOT NULL DEFAULT 0.00,
            created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
            updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
        );
        CREATE INDEX idx_transactions_status ON transactions(status);
        CREATE INDEX idx_escrow_accounts_va ON escrow_accounts(virtual_account_number);
