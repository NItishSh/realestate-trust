          "firstName": "Compliance",
          "lastName": "Officer",
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "password123",
              "temporary": false
            }
          ],
          "realmRoles": ["OFFICER"]
        },
        {
          "username": "admin@realestate.in",
