apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: realestate-trust
data:
  realestate-trust-realm.json: |
    {
      "realm": "realestate-trust",
      "enabled": true,
      "displayName": "Real Estate Trust",
      "sslRequired": "NONE",
      "registrationAllowed": true,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "roles": {
        "realm": [
          { "name": "BUYER", "description": "Property Buyer" },
          { "name": "SELLER", "description": "Property Seller" },
          { "name": "BROKER", "description": "Real Estate Broker" },
          { "name": "OFFICER", "description": "Compliance / Title Officer" },
          { "name": "ADMIN", "description": "Platform Administrator" }
        ]
      },
      "clients": [
        {
          "clientId": "frontend",
          "name": "Real Estate Frontend Client",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": false,
          "redirectUris": [
            "http://localhost:3000/*",
            "http://localhost:8080/*",
            "*"
          ],
          "webOrigins": ["*"]
        },
        {
          "clientId": "microservices",
          "name": "Backend Microservices Client",
          "enabled": true,
          "bearerOnly": true
        }
      ],
      "users": [
        {
          "username": "aryan.dev@realestate.in",
          "email": "aryan.dev@realestate.in",
          "firstName": "Aryan",
          "lastName": "Dev",
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "password123",
              "temporary": false
            }
          ],
          "realmRoles": ["BUYER"]
        },
        {
          "username": "priya.sharma@realestate.in",
          "email": "priya.sharma@realestate.in",
          "firstName": "Priya",
          "lastName": "Sharma",
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "password123",
              "temporary": false
            }
          ],
          "realmRoles": ["SELLER"]
        },
        {
          "username": "ravi.kumar@realestate.in",
          "email": "ravi.kumar@realestate.in",
          "firstName": "Ravi",
          "lastName": "Kumar",
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "password123",
              "temporary": false
            }
          ],
          "realmRoles": ["BROKER"]
        },
        {
