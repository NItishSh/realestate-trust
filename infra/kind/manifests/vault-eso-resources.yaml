apiVersion: v1
kind: Secret
metadata:
  name: vault-token
  namespace: realestate-trust
type: Opaque
stringData:
  token: "root"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: realestate-trust
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      version: "v1"
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: identity-service-db-secret-sync
  namespace: realestate-trust
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: identity-service-db-secret
    creationPolicy: "Owner"
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@postgres:5432/identity_db?sslmode=disable"
  dataFrom:
    - extract:
        key: "database/creds/realestate-trust-role"
---
