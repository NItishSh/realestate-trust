# Kustomize — apply all manifests in correct order
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: realestate-trust

resources:
  - namespace.yaml
  - postgres.yaml
  - transaction-manager.yaml
  - identity-service.yaml
  - financing-engine.yaml
  - tokenization-engine.yaml
  - ledger-service.yaml
  - frontend.yaml

commonLabels:
  managed-by: kind
  environment: development
