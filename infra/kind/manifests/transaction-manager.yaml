# Transaction Manager — Deployment + Service + NodePort
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-manager
  namespace: realestate-trust
  labels:
    app: transaction-manager
    app.kubernetes.io/part-of: realestate-trust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-manager
  template:
    metadata:
      labels:
        app: transaction-manager
    spec:
      containers:
        - name: transaction-manager
          image: realestate-trust-transaction-manager:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: development
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL_TRANSACTIONS
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-manager
  namespace: realestate-trust
  labels:
    app: transaction-manager
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  selector:
    app: transaction-manager
