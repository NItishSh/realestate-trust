# Identity Service — Deployment + Service + NodePort
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: realestate-trust
  labels:
    app: identity-service
    app.kubernetes.io/part-of: realestate-trust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: realestate-trust-identity-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: APP_ENV
              value: development
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL_IDENTITY
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: realestate-trust
  labels:
    app: identity-service
spec:
  type: NodePort
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30081
  selector:
    app: identity-service
