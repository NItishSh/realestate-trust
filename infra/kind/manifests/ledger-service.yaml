# Ledger Service — Deployment + Service + NodePort
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: realestate-trust
  labels:
    app: ledger-service
    app.kubernetes.io/part-of: realestate-trust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-service
  template:
    metadata:
      labels:
        app: ledger-service
    spec:
      containers:
        - name: ledger-service
          image: realestate-trust-ledger-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
          env:
            - name: APP_ENV
              value: development
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-service
  namespace: realestate-trust
  labels:
    app: ledger-service
spec:
  type: NodePort
  ports:
    - port: 8084
      targetPort: 8084
      nodePort: 30084
  selector:
    app: ledger-service
