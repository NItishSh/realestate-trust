name: Release Please (Automated SemVer)

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: go
          # For Go modules in a monorepo, Release Please can manage paths using manifest configs if needed.
          # Here we configure it for a standard root release mapping.
          manifest-config-path: .release-please-manifest.json
          config-path: release-please-config.json
